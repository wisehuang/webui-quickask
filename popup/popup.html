<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>WebUI QuickAsk</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <form id="form" novalidate>
      <h1>WebUI QuickAsk</h1>

      <label for="url">Open WebUI 網址</label>
      <input
        id="url"
        type="text"
        inputmode="url"
        autocomplete="off"
        spellcheck="false"
        placeholder="https://chat.example.com"
      />

      <label for="question">問題</label>
      <textarea id="question" rows="5" placeholder="輸入問題…" autofocus></textarea>

      <p id="status" role="status" aria-live="polite"></p>

      <div class="actions">
        <button id="open-tab" type="button" class="secondary" hidden>前往分頁</button>
        <button id="dismiss" type="button" class="secondary" hidden>清除</button>
        <button id="submit" type="submit" disabled>Submit</button>
      </div>
      <p class="hint">Enter 送出 · Shift+Enter 換行</p>
    </form>
    <script type="module" src="popup.js"></script>
  </body>
</html>
